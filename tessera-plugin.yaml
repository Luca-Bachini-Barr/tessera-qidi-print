# QIDI print: how a print on a QIDI (or any Moonraker / Klipper) printer is coming along, on a tile and on a card: the
# file, the thumbnail, the progress, the time left and when it is done, the layer, the filament in use and the
# temperatures. The sensors come from the Moonraker integration and, for the filament, the QIDI Box integration. Every
# name, label and hint is a key into translations/<language>.json, part "app".
id: qidi_print
version: 0.1.0
api: "0.27"
icon: printer-3d
maintainer: Luca-Bachini-Barr
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 24

tiles:
  - id: print
    name: tile_name
    icon: printer-3d
    sizes: { min: 2x1, max: 4x4, full: true }
    # The tile, its readings and its parts live in PSRAM on the boards with pictures; this is a board without PSRAM's
    # share for about 34 labels and blocks.
    memory: 3600
    # The tile's own entity: the printer's thumbnail camera (its picture shows beside the print), or, on a screen
    # without pictures, any of the printer's sensors.
    domains: [camera, sensor]
    pictures: 1
    example: tile_example
    # The Moonraker device has every sensor but the Box's: one pick fills them.
    from_device: true
    options:
      - { id: print_state, kind: entity, domains: [sensor], matches: [print_state, current_print_state], default: sensor.q2_current_print_state, label: opt_print_state, hint: opt_print_state_hint }
      - { id: filename, kind: entity, domains: [sensor], matches: [filename], default: sensor.q2_filename, label: opt_filename }
      - { id: progress, kind: entity, domains: [sensor], matches: [progress], default: sensor.q2_progress, label: opt_progress }
      - { id: time_left, kind: entity, domains: [sensor], attributes: [unit_of_measurement], matches: [print_time_left], default: sensor.q2_print_time_left, label: opt_time_left }
      - { id: duration, kind: entity, domains: [sensor], attributes: [unit_of_measurement], matches: [print_duration], default: sensor.q2_print_duration, label: opt_duration }
      - { id: current_layer, kind: entity, domains: [sensor], matches: [current_layer], default: sensor.q2_current_layer, label: opt_current_layer }
      - { id: total_layer, kind: entity, domains: [sensor], matches: [total_layer], default: sensor.q2_total_layer, label: opt_total_layer }
      - { id: filament_used, kind: entity, domains: [sensor], attributes: [unit_of_measurement], matches: [filament_used], default: sensor.q2_filament_used, label: opt_filament_used }
      - { id: nozzle, kind: entity, domains: [sensor], device_class: [temperature], matches: [extruder_temperature], default: sensor.q2_extruder_temperature, label: opt_nozzle, group: group_temps }
      - { id: bed, kind: entity, domains: [sensor], device_class: [temperature], matches: [bed_temperature], default: sensor.q2_bed_temperature, label: opt_bed, group: group_temps }
      - { id: chamber, kind: entity, domains: [sensor], device_class: [temperature], matches: [chamber_temperature], default: sensor.q2_chamber_temperature, label: opt_chamber, group: group_temps }
      - { id: speed, kind: entity, domains: [sensor], matches: [print_speed], default: sensor.q2_print_speed, label: opt_speed, group: group_temps }
      # The QIDI Box: the slot that feeds the toolhead says "active", and its colour and type.
      - { id: slot1, kind: entity, domains: [sensor], attributes: [color, active, filament_type], matches: [box_slot_1_filament], default: sensor.dining_room_q2_box_slot_1_filament, label: opt_slot1, hint: opt_slot_hint, group: group_box }
      - { id: slot2, kind: entity, domains: [sensor], attributes: [color, active, filament_type], matches: [box_slot_2_filament], default: sensor.dining_room_q2_box_slot_2_filament, label: opt_slot2, group: group_box }
      - { id: slot3, kind: entity, domains: [sensor], attributes: [color, active, filament_type], matches: [box_slot_3_filament], default: sensor.dining_room_q2_box_slot_3_filament, label: opt_slot3, group: group_box }
      - { id: slot4, kind: entity, domains: [sensor], attributes: [color, active, filament_type], matches: [box_slot_4_filament], default: sensor.dining_room_q2_box_slot_4_filament, label: opt_slot4, group: group_box }

cards:
  - { id: detail, name: card_name, wide: true, pictures: 1 }
